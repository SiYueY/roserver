[project]
name = "roserver"
version = "0.1.0"
description = "Application backend for rodesk / roboagent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "RoboAgent",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
]

[project.optional-dependencies]
robot = ["aiortc>=1.10,<2", "Pillow>=10"]
dev = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.uv.sources]
roboagent = { path = "../roboagent", editable = true }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roserver"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023", "B904", "B905"]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
files = ["roserver"]
